name: ubuntu

on: [push, pull_request]

jobs:
  ci:
    strategy:
      matrix:
        compiler: [clang-18, gcc]
        os: [ubuntu-24.04]
        vp9: [enabled, disabled]
        sanitizer: [none, 'address,undefined']
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler }}
      DISTRO: ${{ matrix.os }}
    steps:
    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: 'Install toolchain'
      if: ${{ (matrix.compiler == 'clang-18') }}
      run: .github/workflows/install-clang.sh 18
    - name: 'Install prerequisites'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libdrm-dev \
          libva-dev \
          libegl-dev \
          libgstreamer-plugins-bad1.0-dev \
          meson
    - name: 'Configure'
      run: meson setup ./builddir --prefix=/usr --buildtype=debugoptimized -Dwerror=true -Dvp9=${{ matrix.vp9 }} -Db_sanitize=${{ matrix.sanitizer }}
    - name: 'Build'
      run: meson compile -C ./builddir
    - name: 'Test'
      run: meson test -C ./builddir --print-errorlogs
    - name: 'Install'
      run: sudo meson install -C ./builddir
